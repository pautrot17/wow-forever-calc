<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoW Forever - Simulateur de Talents & DPS</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #181c24;
            --border-color: #2e3846;
            --accent-gold: #f4c430;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        header h1 {
            font-size: 1.25rem;
            color: var(--accent-gold);
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
            margin-top: 12px;
        }

        /* Class Selector */
        .classes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }

        .class-btn {
            background: #212833;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .class-btn.active {
            border-color: var(--accent-gold);
            background: #2b3342;
            color: var(--accent-gold);
            font-weight: bold;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #111419;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 14px;
            font-size: 0.9rem;
        }

        .stat-item span {
            color: var(--accent-gold);
            font-weight: bold;
        }

        /* Trees Tabs */
        .tree-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tree-tab {
            flex: 1;
            background: #212833;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 4px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
        }

        .tree-tab.active {
            background: #2b3342;
            color: var(--text-main);
            border-color: var(--text-muted);
            font-weight: bold;
        }

        /* Talents List */
        .talents-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .talent-card {
            background: #212833;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .talent-info h3 {
            font-size: 0.85rem;
            margin-bottom: 2px;
        }

        .talent-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .talent-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .talent-controls button {
            width: 26px;
            height: 26px;
            background: #2d3748;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .talent-controls button:active {
            background: var(--accent-gold);
            color: black;
        }

        .talent-controls span {
            font-size: 0.85rem;
            min-width: 24px;
            text-align: center;
        }

        /* Comparator Section */
        .comparator-box {
            background: #111419;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
        }

        .comparator-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .action-btn {
            flex: 1;
            background: #2d3748;
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }

        .action-btn:active {
            background: var(--accent-gold);
            color: black;
        }

        .compare-results {
            font-size: 0.8rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            text-align: center;
        }

        .compare-col {
            background: #181c24;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .compare-col h4 {
            color: var(--text-muted);
            margin-bottom: 4px;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>WoW Forever - Talents & DPS</h1>
        <p>Simulateur mobile optimisé</p>
    </header>

    <!-- Sélecteur de classe -->
    <div class="section-title">Classe</div>
    <div class="classes-grid" id="classGrid"></div>

    <!-- Stats globales -->
    <div class="stats-bar">
        <div class="stat-item">Points : <span id="pointsUsed">0</span>/51</div>
        <div class="stat-item">DPS Estimé : <span id="dpsScore">1000</span></div>
    </div>

    <!-- Onglets des arbres -->
    <div class="tree-tabs" id="treeTabs"></div>

    <!-- Liste des talents -->
    <div class="talents-list" id="talentsList"></div>

    <!-- Comparateur -->
    <div class="comparator-box">
        <div class="section-title" style="margin-top:0;">Comparateur de Builds</div>
        <div class="comparator-buttons">
            <button class="action-btn" onclick="saveBuild(1)">Enregistrer Build 1</button>
            <button class="action-btn" onclick="saveBuild(2)">Enregistrer Build 2</button>
        </div>
        <div class="compare-results">
            <div class="compare-col" id="build1Display">
                <h4>Build 1</h4>
                <div>Aucun</div>
            </div>
            <div class="compare-col" id="build2Display">
                <h4>Build 2</h4>
                <div>Aucun</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Base de données structurée avec des arbres de talents plus complets (ex: Paladin mis en avant)
    const gameData = {
        Paladin: { 
            trees: ["Sacré", "Protection", "Vindicte"], 
            talents: [
                // Arbre Sacré (tree: 0)
                {name: "Divinité divine", max: 5, desc: "+2% efficacité des soins", tree: 0},
                {name: "Grâce spirituelle", max: 3, desc: "-3% coût en mana des sorts", tree: 0},
                {name: "Faveur lumineuse", max: 5, desc: "+1% critique sorts de soins", tree: 0},
                {name: "Illumination", max: 5, desc: "+2% mana récupérée sur critique", tree: 0},
                {name: "Imposition des mains am.", max: 2, desc: "-15m CD Imposition", tree: 0},
                
                // Arbre Protection (tree: 1)
                {name: "Bénédiction renforcée", max: 5, desc: "+2% armure totale", tree: 1},
                {name: "Bouclier de foi", max: 3, desc: "+1% blocage de bouclier", tree: 1},
                {name: "Expertise en défense", max: 5, desc: "+2 aptitude à la défense", tree: 1},
                {name: "Garde purifiée", max: 3, desc: "+3% résistance aux sorts", tree: 1},
                {name: "Vengeance sacrée", max: 5, desc: "+2% menace générée", tree: 1},

                // Arbre Vindicte (tree: 2)
                {name: "Bénédiction de puissance", max: 5, desc: "+2% puissance d'attaque", tree: 2},
                {name: "Conviction", max: 5, desc: "+1% chance de coup critique", tree: 2},
                {name: "Sceau renforcé", max: 3, desc: "+3% dégâts des sceaux", tree: 2},
                {name: "Croisade", max: 3, desc: "+2% dégâts physiques globaux", tree: 2},
                {name: "Jugement implacable", max: 2, desc: "-1s temps de recharge Jugement", tree: 2}
            ]
        },
        Guerrier: { 
            trees: ["Armes", "Fureur", "Protection"], 
            talents: [
                {name: "Maîtrise des armes", max: 5, desc: "+2% dégâts critiques", tree: 0},
                {name: "Empalement", max: 2, desc: "+10% dégâts critiques", tree: 0},
                {name: "Cruauté", max: 5, desc: "+1% chance de coup critique", tree: 1},
                {name: "Flurry", max: 5, desc: "+3% hâte après un critique", tree: 1},
                {name: "Anticipation", max: 5, desc: "+2% esquive", tree: 2},
                {name: "Maîtrise du blocage", max: 1, desc: "Permet de bloquer un coup supplémentaire", tree: 2}
            ]
        },
        Chasseur: { 
            trees: ["Maîtrise des bêtes", "Précision", "Survie"], 
            talents: [
                {name: "Endurance du faucon", max: 5, desc: "+3% santé du familier", tree: 0},
                {name: "Fureur bestiale", max: 1, desc: "Dégâts du familier augmentés", tree: 0},
                {name: "Tir mortel", max: 5, desc: "+1% dégâts à distance", tree: 1},
                {name: "Visée", max: 5, desc: "+1% dégâts visés", tree: 1},
                {name: "Survie pure", max: 5, desc: "+2% agilité", tree: 2}
            ]
        },
        Voleur: { 
            trees: ["Assassinat", "Combat", "Finesse"], 
            talents: [
                {name: "Malice", max: 5, desc: "+1% critique", tree: 0},
                {name: "Sang-froid", max: 1, desc: "Prochain coup critique garanti", tree: 0},
                {name: "Précision", max: 5, desc: "+1% score de toucher", tree: 1},
                {name: "Opportunité", max: 5, desc: "+4% dégâts ambidextrie", tree: 2}
            ]
        },
        Prêtre: { 
            trees: ["Discipline", "Sacré", "Ombre"], 
            talents: [
                {name: "Indomptable", max: 5, desc: "+2% mana max", tree: 0},
                {name: "Spécialisation Soin", max: 5, desc: "+2% efficacité soins", tree: 1},
                {name: "Affinité obscurité", max: 5, desc: "+2% dégâts ombre", tree: 2},
                {name: "Forme d'ombre", max: 1, desc: "Augmente les dégâts d'ombre de 15%", tree: 2}
            ]
        },
        Chaman: { 
            trees: ["Élémentaire", "Amélioration", "Restauration"], 
            talents: [
                {name: "Convection", max: 5, desc: "-2% coût mana sorts", tree: 0},
                {name: "Maîtrise des éléments", max: 1, desc: "-100% coût mana prochain sort", tree: 0},
                {name: "Flurry", max: 5, desc: "+3% hâte en mêlée", tree: 1},
                {name: "Totems affinés", max: 5, desc: "+15% portée totems", tree: 2}
            ]
        },
        Mage: { 
            trees: ["Arcane", "Feu", "Givre"], 
            talents: [
                {name: "Subtilité arcane", max: 5, desc: "-2% menace générée", tree: 0},
                {name: "Incinération", max: 5, desc: "+2% dégâts sorts feu", tree: 1},
                {name: "Pyromane", max: 3, desc: "+1% critique sorts de feu", tree: 1},
                {name: "Piétinement givre", max: 5, desc: "+2% dégâts givre", tree: 2}
            ]
        },
        Démoniste: { 
            trees: ["Affliction", "Démonologie", "Destruction"], 
            talents: [
                {name: "Corruption rapide", max: 5, desc: "-0.4s incantation Corruption", tree: 0},
                {name: "Santé démoniaque", max: 5, desc: "+3% endurance du démon", tree: 1},
                {name: "Cataclysme", max: 5, desc: "+2% dégâts sorts destruction", tree: 2}
            ]
        },
        Druide: { 
            trees: ["Équilibre", "Combat farouche", "Restauration"], 
            talents: [
                {name: "Grâce nature", max: 5, desc: "-0.1s incantation", tree: 0},
                {name: "Fureur sauvage", max: 5, desc: "+2 rage/énergie de départ", tree: 1},
                {name: "Don de la nature", max: 5, desc: "+2% bonus aux soins", tree: 2}
            ]
        }
    };

    let currentClass = "Paladin";
    let currentTreeIndex = 0;
    let talentPoints = {}; 
    let savedBuilds = { 1: null, 2: null };

    function init() {
        renderClasses();
        selectClass(currentClass);
    }

    function renderClasses() {
        const grid = document.getElementById("classGrid");
        grid.innerHTML = "";
        Object.keys(gameData).forEach(className => {
            const btn = document.createElement("button");
            btn.className = `class-btn ${className === currentClass ? "active" : ""}`;
            btn.innerText = className;
            btn.onclick = () => selectClass(className);
            grid.appendChild(btn);
        });
    }

    function selectClass(className) {
        currentClass = className;
        currentTreeIndex = 0;
        
        if (!talentPoints[className]) {
            talentPoints[className] = {};
            gameData[className].talents.forEach((t, idx) => {
                talentPoints[className][idx] = 0;
            });
        }
        
        renderClasses();
        renderTabs();
        renderTalents();
        updateStats();
    }

    function renderTabs() {
        const tabsContainer = document.getElementById("treeTabs");
        tabsContainer.innerHTML = "";
        const trees = gameData[currentClass].trees;
        
        trees.forEach((treeName, idx) => {
            const tab = document.createElement("div");
            tab.className = `tree-tab ${idx === currentTreeIndex ? "active" : ""}`;
            tab.innerText = treeName;
            tab.onclick = () => {
                currentTreeIndex = idx;
                renderTabs();
                renderTalents();
            };
            tabsContainer.appendChild(tab);
        });
    }

    function renderTalents() {
        const list = document.getElementById("talentsList");
        list.innerHTML = "";
        
        const classData = gameData[currentClass];
        classData.talents.forEach((talent, idx) => {
            if (talent.tree === currentTreeIndex) {
                const points = talentPoints[currentClass][idx] || 0;
                
                const card = document.createElement("div");
                card.className = "talent-card";
                card.innerHTML = `
                    <div class="talent-info">
                        <h3>${talent.name}</h3>
                        <p>${talent.desc}</p>
                    </div>
                    <div class="talent-controls">
                        <button onclick="changePoints(${idx}, -1)">-</button>
                        <span>${points}/${talent.max}</span>
                        <button onclick="changePoints(${idx}, 1)">+</button>
                    </div>
                `;
                list.appendChild(card
